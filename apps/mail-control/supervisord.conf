; ProjectHub self-hosted Postfix — supervisord configuration.
;
; Three programs, supervised together in ONE container (this is what makes
; the control-plane architecture's "co-located with Postfix's own master
; process" requirement true — no docker-exec/docker-socket is ever needed
; to reload Postfix, because the listener and Postfix share this same
; supervisor and filesystem). All three log to stdout/stderr so
; `docker compose logs postfix` shows everything.
;
; Copied to /etc/supervisor/conf.d/mail-control.conf at image build time.

[unix_http_server]
file=/var/run/supervisor.sock
; Group-owned (not world-writable) so the unprivileged `mailctl` user can
; run `supervisorctl status` (used by src/postfix.ts#readProcessStatuses)
; without root — see the Dockerfile, which chgrp's this socket's parent
; directory and adds `mailctl` to the appropriate group.
chmod=0770
chown=root:mailctl

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postfix]
command=/usr/sbin/postfix start-fg
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=2

[program:opendkim]
command=/usr/sbin/opendkim -f -x /etc/opendkim.conf
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=2

[program:control]
command=/usr/local/bin/node /opt/mail-control/index.js
user=mailctl
environment=HOME="/home/mailctl"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=2
