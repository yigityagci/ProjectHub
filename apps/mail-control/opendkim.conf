# ProjectHub self-hosted Postfix — OpenDKIM configuration.
#
# Baked into the image at /etc/opendkim.conf. KeyTable/SigningTable/
# TrustedHosts are regenerated at apply-time by src/opendkim.ts from
# validated sendingDomain/dkimSelector values only — this file's paths to
# those tables are fixed and never rewritten by an apply.

Syslog			no
LogWhy			yes

UMask			007
UserID			opendkim:opendkim

Socket			inet:8891@127.0.0.1
PidFile			/var/run/opendkim/opendkim.pid

Mode			s
Canonicalization	relaxed/simple

KeyTable		/etc/opendkim/KeyTable
SigningTable		refile:/etc/opendkim/SigningTable
ExternalIgnoreList	/etc/opendkim/TrustedHosts
InternalHosts		/etc/opendkim/TrustedHosts

# Milter protocol version Postfix speaks (matches milter_protocol = 6 in
# main.cf.base).
MilterDebug		0
